[project]
name = "falsifiable-state-reconstruction-engine"
version = "0.1.0"
description = "Estimate fluid-system states, check declared physical balances, and preserve evidence of measurement disagreement."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/set_lcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-size experiment runs (minutes); select with -m slow"]
addopts = "-m 'not slow'"
