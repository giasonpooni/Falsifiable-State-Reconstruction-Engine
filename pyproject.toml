[project]
name = "falsifiable-state-reconstruction-engine"
version = "0.1.0"
description = "State estimates that ship with the statistic that can reject them. Phase 1: SET + LCM on a two-reservoir material-transfer system."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/set_lcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-size experiment runs (minutes); select with -m slow"]
addopts = "-m 'not slow'"
